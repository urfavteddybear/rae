# Minimal Lavalink config for the optional local compose service.
# Remote instances use their own config — bot only needs HOST/PORT/PASSWORD.
server:
  port: 2333
  address: 0.0.0.0
lavalink:
  server:
    password: ${LAVALINK_SERVER_PASSWORD:-youshallnotpass}
    sources:
      youtube: true
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false
    filters:
      volume: true
    bufferDurationMs: 400
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true
    # youtube oauth token omitted — set per Lavalink docs if search needs it
plugins: {}
metrics:
  prometheus:
    enabled: false
logging:
  level:
    root: INFO
    lavalink: INFO
